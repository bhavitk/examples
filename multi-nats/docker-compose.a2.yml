services:
  nats-a2:
    image: nats:2.10-alpine
    container_name: nats-a2
    command: ["-c", "/etc/nats/device.conf"]
    volumes:
      - ./nats-config/device-a2.conf:/etc/nats/device.conf:ro
      - ./nsc-data/creds/a2.creds:/etc/nats/leaf.creds:ro
    networks:
      default: {}

  device-a2-client:
    build: ./app
    container_name: device-a2-client
    environment:
      ROLE: device
      DEVICE_ID: a2
      NATS_URL: nats://nats-a2:4222
      NATS_USER: a2
      NATS_PASS: 5cf51e1261959f1a0f1f87fe
    depends_on:
      - nats-a2
    networks:
      default: {}

networks:
  default:
    name: multi-nats_default
    external: true
