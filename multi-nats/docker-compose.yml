services:
  nats-remote:
    image: nats:2.10-alpine
    container_name: nats-remote
    command: ["-c", "/etc/nats/remote.conf"]
    volumes:
      - ./nats-config/remote.conf:/etc/nats/remote.conf:ro
      - ./nats-config/resolver.conf:/etc/nats/resolver.conf:ro
    ports:
      - "4222:4222"
      - "8222:8222"

  remote-client:
    build: ./app
    container_name: remote-client
    environment:
      ROLE: remote
      NATS_URL: nats://nats-remote:4222
      NATS_CREDS: /etc/nats/remote.creds
    volumes:
      - ./nsc-data/creds/remote.creds:/etc/nats/remote.creds:ro
    depends_on:
      - nats-remote
